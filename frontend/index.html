<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitStop Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-logo"></span>
      <div class="brand-text">
        <span class="brand-line-1">PITSTOP</span>
        <span class="brand-line-2">AI RACE SIMULATOR</span>
      </div>
    </div>
    <nav class="primary-nav">
      <a href="#/" data-route="new">NEW SIMULATION</a>

    <section class="loader">
      <div class="spinner"></div>
      <p>Loading…</p>

  <footer class="site-footer">
    <p>Simulations by Claude · Data: FastF1 · race context from qualifying, practice long runs and circuit characteristics</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.5/dist/chart.umd.min.js"></script>
  <script type="module" src="./src/main.js"></script>
