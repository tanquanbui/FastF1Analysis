<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitStop Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-logo"></span>
      <div class="brand-text">
        <span class="brand-line-1">PITSTOP</span>
        <span class="brand-line-2">ANALYTICS</span>
      </div>
    </div>
    <nav class="primary-nav">
      <a href="#/season" data-route="season">SEASON</a>
      <a href="#/race" data-route="race">RACE</a>
      <a href="#/standings" data-route="standings">STANDINGS</a>
      <a href="#/team" data-route="team">TEAM INTEL</a>
      <a href="#/circuit" data-route="circuit">CIRCUIT</a>
      <a href="#/predictor" data-route="predictor">PREDICTOR</a>
      <a href="#/championship" data-route="championship">TITLE SIM</a>
    </nav>
  </header>

  <aside class="f1-lights" aria-hidden="true">
    <span class="f1-light"></span>
    <span class="f1-light"></span>
    <span class="f1-light"></span>
    <span class="f1-light"></span>
    <span class="f1-light"></span>
    <span class="f1-light"></span>
    <span class="f1-light"></span>
  </aside>

  <main id="app">
    <section class="loader">
      <div class="spinner"></div>
      <p>Loading…</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Data: FastF1 · Ergast (jolpi.ca mirror) · Last updated <span id="last-updated">—</span></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.5/dist/chart.umd.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
