name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths:
      - "template.yaml"
      - "samconfig.toml"
      - "functions/**"
      - "ml/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # for OIDC AWS auth
  contents: read

env:
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_REGION: ap-southeast-2
  DASHBOARD_CUSTOM_DOMAIN: ${{ vars.DASHBOARD_CUSTOM_DOMAIN }}
  DASHBOARD_CERTIFICATE_ARN: ${{ secrets.DASHBOARD_CERTIFICATE_ARN }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [ingestion, processor, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: functions/${{ matrix.function }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: functions/${{ matrix.function }}
        run: python -m pytest --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - run: ruff check functions/ scripts/ ml/ 2>/dev/null || true
      - run: black --check functions/ scripts/ ml/ 2>/dev/null || true

  deploy:
    name: SAM deploy (${{ github.event.inputs.environment || 'dev' }})
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: SAM validate
        run: sam validate --lint

      - name: SAM build
        run: sam build --use-container

      - name: SAM deploy
        run: |
          ENV_INPUT="${{ github.event.inputs.environment || 'dev' }}"
          if [ "$ENV_INPUT" = "prod" ]; then CONFIG_ENV=prod; else CONFIG_ENV=default; fi
          sam deploy \
            --config-env "$CONFIG_ENV" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-image-repos \
            --parameter-overrides \
              Environment="$ENV_INPUT" \
              EnableDataPipeline=true \
              EnablePhase2=true \
              DashboardCustomDomainName="$DASHBOARD_CUSTOM_DOMAIN" \
              DashboardCertificateArn="$DASHBOARD_CERTIFICATE_ARN"
